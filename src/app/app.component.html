<ion-app>
  <ion-split-pane when="lg" contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content class="menu-shell">
        <div class="menu-hero">
          <div class="brand-mark">CP</div>
          <div class="brand-copy">
            <p class="eyebrow">Cricket Platform</p>
            <h2>Mobile Matchdesk</h2>
            <p>Run live scoring, tournaments, and premium match experiences from one clean console.</p>
          </div>
        </div>

        <ion-list lines="none" class="menu-list">
          <ion-menu-toggle auto-hide="false" *ngFor="let item of navItems">
            <ion-item
              class="menu-item"
              detail="false"
              [routerLink]="item.route"
              routerDirection="root">
              <ion-icon [name]="item.icon" slot="start"></ion-icon>
              <ion-label>
                <strong>{{ item.label }}</strong>
                <p>{{ item.note }}</p>
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <div class="menu-footer glass-panel">
          <div class="theme-row">
            <div>
              <p class="eyebrow">Display</p>
              <h3>{{ theme.isDark() ? 'Night Match' : 'Pavilion Light' }}</h3>
            </div>
            <ion-toggle [checked]="theme.isDark()" (ionChange)="toggleTheme($event)"></ion-toggle>
          </div>

          <div class="menu-footnote">
            Free, Basic, and Premium match experiences live in one app shell.
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-router-outlet></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
